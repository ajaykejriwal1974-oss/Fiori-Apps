    excludes:
      - "/test/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZSALESDOC_APP
          package: ZKGPL_FIORI
          transport: KSDK906624
          description: "KGPL Sales Document Status (Fiori Elements)"

specVersion: "3.0"
metadata:
  name: kejriwal.pp.jobcardreport
type: application
builder:
  resources:
    excludes: [ "/test/**", "/localService/**" ]
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZJOBCARD_RPT
          package: ZKGPL_FIORI
          transport: KSDK906927
          description: "Job Card Report"
        exclude: [ "/test/" ]

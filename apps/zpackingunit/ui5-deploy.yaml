specVersion: "3.0"
metadata:
  name: zpackingunit
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://kejerpd4:5200
          client: "500"
        app:
          name: ZPACKINGUNIT
          package: ZKGPL_FIORI
          transport: KSDK906624
          description: Packing Units
        exclude:
          - "/test/"

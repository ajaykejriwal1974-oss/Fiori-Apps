specVersion: "3.1"
metadata:
  name: qc-raw-material
type: application
builder:
  resources:
    excludes:
      - "/test/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZQC_RAW_DYE
          package: ZKGPL_FIORI
          description: Raw Material QC
          transport: <TRANSPORT>
        exclude:
          - /test/

# Deploy config for on-premise S/4HANA (KSD). Credentials via env FIORI_TOOLS_USER/_PASSWORD.
specVersion: "3.0"
metadata:
  name: kejriwal.fi.vform
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZVFORM_APP
          package: ZKGPL_FIORI
          transport: KSDK906624
          description: "KGPL Vendor Invoice Allocation (Fiori Elements)"
        exclude:
          - "/test/"

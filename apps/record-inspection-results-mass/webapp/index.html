<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Inspection Results (Mass)</title>
    <!-- Without this the app renders blank when opened standalone: the
         component div below asks for height:100%, but html and body have no
         height of their own, so 100% resolves to nothing and the whole page
         collapses to ~88px - the filter bar disappears and the table is
         crushed to zero. It only shows up outside the Fiori launchpad,
         because the launchpad shell supplies the sizing container itself.
         The other three QC apps already carry this block; this one was
         generated without it. Added 2026-08-29. -->
    <style>
        html, body, body > div { height: 100%; margin: 0; }
        #container, #container-uiarea, #container-uiarea > div { height: 100%; }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{"kejriwal.qm.inspectionresultmass": "./"}'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true">
    </script>
</head>
<body class="sapUiBody">
    <div
        data-sap-ui-component
        data-name="kejriwal.qm.inspectionresultmass"
        data-id="container"
        data-settings='{"id": "inspectionResultMass"}'
        style="height: 100%">
    </div>
</body>
</html>

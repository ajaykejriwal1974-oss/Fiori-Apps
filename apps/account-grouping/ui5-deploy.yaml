# Deploy config for on-premise S/4HANA (KSD). Credentials are NOT stored here —
# fiori deploy prompts for them, or set env FIORI_TOOLS_USER / FIORI_TOOLS_PASSWORD.
specVersion: "3.0"
metadata:
  name: kejriwal.fi.accgrp
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZACCGRP_APP
          package: ZKGPL_FIORI
          transport: KSDK906624
          description: "KGPL Account Grouping (Fiori Elements)"
        exclude:
          - "/test/"

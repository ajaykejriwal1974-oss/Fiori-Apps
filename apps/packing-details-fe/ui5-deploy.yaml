# PACKAGE / TRANSPORT - corrected 2026-08-30.
# This said package: "$TMP". TADIR puts ZPACKING_FE in ZKGPL_FIORI, which is
# transportable, so a $TMP upload is refused with "ABAP workbench request for
# SAPUI5 ABAP Repository not specified" and, in test mode, "Cannot change
# package assignment from ZKGPL_FIORI to $TMP".
# KSDK906759 is the workbench request holding the matching backend change
# (verified modifiable, owner MD, on 30.08.2026).
specVersion: "3.0"
metadata:
  name: kejriwal.pp.packingdetailfe
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZPACKING_FE
          package: ZKGPL_FIORI
          transport: KSDK906759
          description: "Packing Details (FE)"
        exclude:
          - "/test/"

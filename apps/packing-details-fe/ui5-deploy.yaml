specVersion: "3.0"
metadata:
  name: kejriwal.pp.packingdetailfe
type: application
builder:
  resources:
    excludes: [ "/test/**", "/localService/**" ]
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target: { url: http://192.168.0.19:8000, client: "500" }
        app: { name: ZPACKING_FE, package: "$TMP", description: "Packing Details (FE)" }
        exclude: [ "/test/" ]

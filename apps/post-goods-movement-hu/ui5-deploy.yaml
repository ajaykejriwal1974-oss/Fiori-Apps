# Deploy config for on-premise S/4HANA (KSD). Credentials are NOT stored here.
specVersion: "3.0"
metadata:
  name: kejriwal.mm.goodsmovementhu
type: application
builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZPOST_GM_HU
          package: ZKGPL_FIORI
          transport: KSDK906624
          description: "KGPL Post Goods Movement HU"
        exclude:
          - "/test/"

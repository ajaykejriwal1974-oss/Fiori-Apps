specVersion: "3.0"
metadata:
  name: kejriwal.pp.batchstatusfe
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZBATCH_FE
          package: "$TMP"
          description: "KGPL Batch Status - Fiori Elements"
        exclude:
          - "/test/"

# Deploy config for on-premise S/4HANA (KSD). Credentials are NOT stored here —
# fiori deploy prompts for them, or set env UI5_TASK_ABAP_USER / _PASSWORD.
specVersion: "3.0"
metadata:
  name: kejriwal.pp.shademaster
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://192.168.0.19:8000
          client: "500"
        app:
          name: ZDD_SHADE_APP
          package: ZKGPL_FIORI
          transport: KSDK906624
          description: "KGPL Shade Master (Fiori Elements)"
        exclude:
          - "/test/"
